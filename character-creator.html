<title>転生者登録票</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
/* Layout: 役所の登録票。左に記入欄（タブ）、右に常時見える集計欄。狭い画面では集計を下に、残りポイントを下端に固定。 */
:root {
  --paper: #eef1f6;
  --sheet: #ffffff;
  --ink: #17223b;
  --muted: #5a6580;
  --line: #d3d9e6;
  --accent: #3a47a8;
  --accent-ink: #ffffff;
  --accent-soft: #e2e5f6;
  --gold: #946313;
  --gold-soft: #f5ead6;
  --bad: #b3261e;
  --bad-soft: #fbe8e6;
  --warn: #855600;
  --warn-soft: #fbf0d9;
  --good: #1d7347;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1420; --sheet: #161d2c; --ink: #e5e9f3; --muted: #9ba5be; --line: #2b3449;
    --accent: #8f9bff; --accent-ink: #0f1420; --accent-soft: #232a4c; --gold: #e2b45e; --gold-soft: #2e2615;
    --bad: #ff8b80; --bad-soft: #3a1d1d; --warn: #f0c262; --warn-soft: #33290f; --good: #6fd3a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1420; --sheet: #161d2c; --ink: #e5e9f3; --muted: #9ba5be; --line: #2b3449;
  --accent: #8f9bff; --accent-ink: #0f1420; --accent-soft: #232a4c; --gold: #e2b45e; --gold-soft: #2e2615;
  --bad: #ff8b80; --bad-soft: #3a1d1d; --warn: #f0c262; --warn-soft: #33290f; --good: #6fd3a0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 96px;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }

/* 見出し帯 */
.masthead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
.masthead h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 4vw, 36px); line-height: 1.2; margin: 0; letter-spacing: .04em; text-wrap: balance; }
.masthead .form-no { font-family: var(--font-num); font-size: 12px; color: var(--muted); letter-spacing: .08em; display: block; margin-bottom: 4px; }
.masthead p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--sheet); }
.chip.account { color: var(--good); border-color: currentColor; }
.chip.device { color: var(--warn); border-color: currentColor; }

.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: var(--r); padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { color: var(--accent-ink); filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 10px; font-size: 13px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
.sec { padding: 18px 20px; display: grid; gap: 14px; }
.sec + .sec { border-top: 1px solid var(--line); }
.sec h2 { font-family: var(--font-display); font-size: 19px; font-weight: 800; margin: 0; letter-spacing: .03em; }
.sec h3 { font-size: 13px; margin: 0; color: var(--muted); letter-spacing: .08em; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 700; }
.field input, .field textarea, .field select, .inline-input {
  border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); padding: 8px 10px; width: 100%;
}
.field textarea { min-height: 86px; resize: vertical; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

/* 見本の案内 */
.notice { border: 1px dashed var(--gold); background: var(--gold-soft); border-radius: var(--r); padding: 10px 14px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }

/* AIの配分案 */
.proposal { border: 1px solid var(--accent); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; background: var(--accent-soft); }
.proposal .rationale { margin: 0; }
.proposal ul { margin: 0; padding-left: 1.2em; font-size: 14px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* タブ */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); }
.tab { border: 1px solid transparent; border-bottom: none; background: none; padding: 8px 14px; cursor: pointer; border-radius: var(--r) var(--r) 0 0; color: var(--muted); font-weight: 700; font-size: 14px; position: relative; top: 1px; }
.tab[aria-selected="true"] { background: var(--sheet); border-color: var(--line); color: var(--ink); }
.tab .badge { font-family: var(--font-num); font-size: 11px; margin-left: 4px; color: var(--accent); }
.panel { padding: 16px 20px 20px; display: grid; gap: 12px; }

/* 能力値 */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.stat .name { font-weight: 700; }
.stat .sub { font-size: 12px; color: var(--muted); grid-column: 1; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; grid-row: span 2; }
.stepper button { border: none; background: var(--paper); width: 32px; height: 34px; cursor: pointer; font-size: 18px; line-height: 1; }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper output { min-width: 44px; text-align: center; font-family: var(--font-num); font-weight: 600; font-size: 17px; }

/* 一覧（技能・特徴） */
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filter { border: 1px solid var(--line); border-radius: 999px; background: none; padding: 3px 11px; font-size: 13px; cursor: pointer; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.filters .inline-input { width: auto; flex: 1 1 160px; padding: 5px 10px; }
.filters label.toggle { font-size: 13px; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.list { display: grid; border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 2px; border-bottom: 1px solid var(--line); align-items: center; }
.item.owned { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); }
.item.locked { opacity: .55; }
.item .title { font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.item .meta { font-size: 12px; color: var(--muted); font-weight: 400; }
.item .desc { font-size: 13px; color: var(--muted); margin: 0; grid-column: 1; }
.item .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; grid-row: span 2; }
.item .sub-controls { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.item .sub-controls .inline-input { width: auto; flex: 1 1 200px; padding: 5px 8px; }
.item select, .sub-controls select { border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); padding: 4px 6px; }
.value { font-family: var(--font-num); font-weight: 600; font-size: 18px; min-width: 2.2em; text-align: right; }
.value.untrained { color: var(--muted); font-size: 14px; }
.cost { font-family: var(--font-num); font-size: 13px; color: var(--muted); white-space: nowrap; }
.cost.neg { color: var(--good); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.empty { color: var(--muted); padding: 16px 0; margin: 0; }

.reinc-banner { border-left: 4px solid var(--gold); background: var(--gold-soft); padding: 10px 14px; border-radius: 0 var(--r) var(--r) 0; font-size: 14px; }
.item.reinc.owned { background: linear-gradient(90deg, var(--gold-soft), transparent 70%); }

/* 集計欄 */
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 900px) { .summary { position: static; } }
.meter { display: grid; gap: 6px; }
.meter .big { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.meter .big strong { font-family: var(--font-num); font-size: 34px; line-height: 1; }
.meter .big strong.over { color: var(--bad); }
.bar { height: 8px; border-radius: 4px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.bar span.over { background: var(--bad); }
table.bd { width: 100%; border-collapse: collapse; font-size: 14px; }
table.bd td { padding: 4px 0; border-bottom: 1px dotted var(--line); }
table.bd td.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
table.bd tr.total td { border-bottom: none; border-top: 2px solid var(--ink); font-weight: 700; padding-top: 6px; }
.derived { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.derived div { border: 1px solid var(--line); border-radius: var(--r); padding: 4px 6px; text-align: center; }
.derived span { display: block; font-size: 11px; color: var(--muted); }
.derived b { font-family: var(--font-num); font-size: 17px; }
.top-skills { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14px; }
.top-skills li { display: flex; justify-content: space-between; gap: 8px; }
.issues { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
.issues li { padding: 6px 10px; border-radius: var(--r); }
.issues li.error { background: var(--bad-soft); color: var(--bad); }
.issues li.warn { background: var(--warn-soft); color: var(--warn); }
.issues li.ok { background: none; color: var(--good); padding-left: 0; }
.points-total { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.points-total input { width: 80px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); padding: 4px 8px; }

/* 保存済み一覧 */
.library { display: grid; gap: 8px; }
.lib-item { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.lib-item .who { min-width: 0; }
.lib-item .who b { display: block; }
.lib-item .who span { font-size: 12px; color: var(--muted); }

details.json summary { cursor: pointer; font-weight: 700; }
details.json textarea { width: 100%; min-height: 140px; font-family: var(--font-num); font-size: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); padding: 8px; }

.status { margin: 0; font-size: 14px; color: var(--muted); }
.status:empty { display: none; }
.panel h3 { font-size: 13px; margin: 8px 0 0; color: var(--muted); letter-spacing: .08em; }
.status.error { color: var(--bad); }

/* 狭い画面の下端バー */
.dock { display: none; }
@media (max-width: 900px) {
  .dock {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; gap: 10px; align-items: center; justify-content: space-between;
    background: var(--sheet); border-top: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .dock strong { font-family: var(--font-num); font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .tab, .filter { transition: border-color .15s, color .15s, background-color .15s; }
}
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <span class="form-no">FORM R-120 ／ ルール v<span id="rules-version">0.1.0</span></span>
      <h1>転生者登録票</h1>
      <p>ポイントを割り振って、異世界に降り立つあなたを決める。</p>
    </div>
    <div class="toolbar">
      <span class="chip" id="storage-chip">保存先を確認中…</span>
      <button class="btn" id="btn-library" aria-expanded="false" aria-controls="library-sec">保存済み</button>
      <button class="btn" id="btn-new">新規作成</button>
      <button class="btn primary" id="btn-save">保存</button>
    </div>
  </header>

  <section class="sheet" id="library-sec" hidden>
    <div class="sec">
      <h2>保存済みのキャラクター</h2>
      <div class="library" id="library"><p class="empty">読み込み中…</p></div>
    </div>
  </section>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="layout">
    <main class="sheet">
      <div class="sec">
        <div class="notice" id="sample-notice" hidden>
          <span>見本のキャラクター「ユウト」を表示しています。書き換えて使うか、「新規作成」で白紙から始められます。</span>
          <button class="btn small" id="btn-dismiss-sample">見本のまま続ける</button>
        </div>
        <div class="field">
          <label for="f-name">名前</label>
          <input id="f-name" autocomplete="off" maxlength="40" placeholder="例：ユウト">
        </div>
        <div class="field">
          <label for="f-concept">設定</label>
          <textarea id="f-concept" maxlength="800" placeholder="例：元社畜の薬師。前世は製薬会社の研究員で、臆病だが薬草には目がない。"></textarea>
        </div>
        <div class="row-actions">
          <button class="btn primary" id="btn-suggest">設定から配分案を作る</button>
          <button class="btn" id="btn-stop" hidden>中止</button>
        </div>
        <p class="hint" id="ai-hint">AIが設定に合うポイント配分を提案します。案は自動では反映されません。</p>
        <div id="proposal"></div>
      </div>

      <nav class="tabs" role="tablist" aria-label="記入欄">
        <button class="tab" role="tab" id="tab-attrs" data-tab="attrs" aria-selected="true">能力値</button>
        <button class="tab" role="tab" id="tab-skills" data-tab="skills" aria-selected="false">技能<span class="badge" id="badge-skills"></span></button>
        <button class="tab" role="tab" id="tab-traits" data-tab="traits" aria-selected="false">特徴・欠点<span class="badge" id="badge-traits"></span></button>
        <button class="tab" role="tab" id="tab-reinc" data-tab="reinc" aria-selected="false">転生技能<span class="badge" id="badge-reinc"></span></button>
        <button class="tab" role="tab" id="tab-gear" data-tab="gear" aria-selected="false">装備</button>
      </nav>
      <div class="panel" id="panel" role="tabpanel"></div>

      <div class="sec">
        <details class="json">
          <summary>JSONで書き出し・読み込み</summary>
          <div class="field" style="margin-top:10px">
            <label for="f-json">キャラクターのJSON</label>
            <textarea id="f-json" spellcheck="false"></textarea>
          </div>
          <div class="row-actions">
            <button class="btn small" id="btn-copy">コピー</button>
            <button class="btn small" id="btn-import">この内容を読み込む</button>
          </div>
        </details>
      </div>
    </main>

    <aside class="sheet summary" id="summary" aria-label="集計"></aside>
  </div>
</div>

<div class="dock">
  <span>残り <strong id="dock-points" class="num">0</strong> pt</span>
  <span id="dock-issues"></span>
  <a class="btn small" href="#summary">集計を見る</a>
</div>

<script type="module" src="app/charcreator/main.mjs"></script>
