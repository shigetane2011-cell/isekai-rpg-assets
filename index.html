/* ============================================================================
   維新の乱流 ― 決定論エンジン
   ・乱数は seed 付き mulberry32 のみ。Math.random / Date.now は一切使用しない。
   ・seed + 選択列 だけが状態を決める。同じ入力なら常に同じ盤面になる。
   ========================================================================== */

const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

/* --- PRNG --------------------------------------------------------------- */
function mulberry32(a){
  a = a >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* 呼び出し順に依存しないよう、用途ごとに独立した流れを作る */
function streamOf(seed, turn, salt){
  let h = (seed >>> 0) ^ Math.imul(turn + 1, 0x9E3779B1) ^ Math.imul(salt + 1, 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35) >>> 0;
  return mulberry32(h);
}
function pickDistinct(rnd, pool, n){
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}

/* --- 状態 ---------------------------------------------------------------- */
const MAX_TURN = 10, GOAL = 30, CAP = 40;

function createState(seed){
  return { seed: seed >>> 0, turn: 1, currents:[0,0,0,0,0],
           contacts:[], banned:[], lastLen:0, actions:[], finished:false };
}
const totalOf = st => st.currents.reduce((a,b)=>a+b,0);
const eraOf   = st => eraOfTotal(totalOf(st));

/* 基点ID: (直前の論証文の文字数 × ターン数) の下2桁。第1ターンのみ seed から */
function baseId(st){
  if (st.turn === 1) return Math.floor(streamOf(st.seed, 0, 7)() * 100) + 1;
  const v = (st.lastLen * st.turn) % 100;
  return v === 0 ? 100 : v;
}

/* 面会リスト: 通常枠3名 ＋ 紹介枠0..1名 */
function meetingList(st){
  const era = eraOf(st), maxId = MAX_ID_BY_ERA[era];
  const b = baseId(st);
  const taken = new Set(), normal = [];
  for (const raw of [b, b + 37, b + 73]){
    const r = raw > 100 ? raw - 100 : raw;
    let id = rankOfId(r) > era ? (r % 30) + 1 : r;   // ランク補正（強制変換）
    let guard = 0;
    while (guard++ < 400 && (taken.has(id) || st.contacts.includes(id) || st.banned.includes(id)))
      id = (id % maxId) + 1;                          // 重複・既獲得・決裂は前方へ送る
    taken.add(id); normal.push(id);
  }
  return { base: b, normal, intro: introPick(st, taken) };
}

/* 紹介枠: 人脈が空なら必ず null（原作の厳守事項） */
function introPick(st, exclude){
  if (!st.contacts.length) return null;
  const excl = new Set([...st.contacts, ...st.banned, ...(exclude || [])]);
  let cands = [];
  for (const c of st.contacts) for (const t of (TIES[c] || [])) if (!excl.has(t)) cands.push(t);
  let byTie = cands.length > 0;
  if (!byTie){                                        // 縁が尽きたら同勢力の未獲得から
    const facs = new Set(st.contacts.flatMap(c => CHAR_BY_ID.get(c).factions));
    cands = CHARACTERS.filter(ch => !excl.has(ch.id) && ch.factions.some(f => facs.has(f))).map(ch => ch.id);
  }
  if (!cands.length) return null;
  let best = cands[0];
  for (const id of cands){                            // 高ランク優先、同ランクは小さいID
    if (rankOfId(id) > rankOfId(best) || (rankOfId(id) === rankOfId(best) && id < best)) best = id;
  }
  return best;
}

/* 論証カードの提示（各カテゴリ4枚。正解1＋ダミー3、並びも決定論的） */
function cardOptions(st, charId, faction){
  const ch = CHAR_BY_ID.get(charId), out = [];
  for (let cat = 0; cat < 3; cat++){
    const correct = ch.correct[cat];
    const rnd = streamOf(st.seed, st.turn, charId * 13 + faction * 7 + cat);
    const decoys = pickDistinct(rnd, [0,1,2,3,4,5].filter(m => m !== correct), 3);
    out.push(pickDistinct(rnd, [correct, ...decoys], 4)
      .map(m => ({ motive:m, text: CARDS[faction][cat][m] })));
  }
  return out;
}

/* 論証文の組み立て。プレビューと判定で必ず同一の文字列になるよう1か所に集約する。
   ここで得られる文字数が、次ターンの基点IDを決める。 */
function composeArgument(argueF, cards){
  return [0,1,2].map(i => CARDS[argueF][i][cards[i]]).join('。') + '。';
}

/* --- 交渉の解決 ---------------------------------------------------------- */
/* action = { charId, stance:'support'|'convert', ownF, argueF, cards:[m0,m1,m2] } */
function resolve(st, action){
  const ch = CHAR_BY_ID.get(action.charId);
  const era = eraOf(st), rank = rankOfId(action.charId);
  const premature = rank > era;                       // 時代整合性チェック
  const effRank = premature ? 0 : rank;               // 時期尚早ならボーナス無効（初級相当）

  const hits = [0,1,2].map(i => action.cards[i] === ch.correct[i]);
  const score = hits.filter(Boolean).length;
  const text  = composeArgument(action.argueF, action.cards);
  const len   = chars(text);

  let gain = score === 3 ? 4 : score === 2 ? 2 : 0;
  if (gain > 0){
    if (effRank === 1) gain += 1;
    else if (effRank === 2) gain += 2;
    else if (effRank === 3) gain *= 2;
  }
  let penalty = 0;
  if (score <= 1 && !premature){
    if (effRank === 2) penalty = 1;
    else if (effRank === 3) penalty = 3;
  }

  const cur = st.currents.slice();
  const before = cur.slice();
  if (gain > 0){
    cur[action.argueF] += gain;
    if (action.stance === 'convert') cur[action.ownF] -= (score === 3 ? 2 : 1);
  }
  if (penalty) cur[action.stance === 'support' ? action.ownF : action.argueF] -= penalty;
  for (let i = 0; i < 5; i++) cur[i] = clamp(cur[i], 0, CAP);

  const contacts = st.contacts.slice(), banned = st.banned.slice();
  if (score >= 2 && !contacts.includes(action.charId)) contacts.push(action.charId);
  if (score === 0 && !banned.includes(action.charId)) banned.push(action.charId);

  const next = {
    seed: st.seed, turn: st.turn + 1, currents: cur, contacts, banned,
    lastLen: len, actions: st.actions.concat([action]), finished: false,
  };
  next.finished = next.turn > MAX_TURN || cur.some(v => v >= CAP);

  return { next, report: {
    charId: action.charId, name: ch.name, score, hits, premature, rank, effRank,
    gain, penalty, text, len, stance: action.stance, ownF: action.ownF, argueF: action.argueF,
    delta: cur.map((v, i) => v - before[i]),
    verdict: ['決裂','失敗','成功','大成功'][score],
    contactAdded: score >= 2, bannedNow: score === 0,
  }};
}

/* --- エンディング判定 ---------------------------------------------------- */
function evaluateEnding(st){
  const cur = st.currents, max = Math.max(...cur);
  if (max >= GOAL){
    const f = cur.indexOf(max);
    return Object.assign({ kind:'solo', faction:f }, ENDINGS.solo[f]);
  }
  const order = [0,1,2,3,4].sort((a,b) => cur[b] - cur[a] || a - b);
  const [a, b] = order;
  if (cur[a] + cur[b] >= GOAL){
    const key = [a,b].sort((x,y) => x - y).join('+');
    return Object.assign({ kind:'combo', pair:[a,b] }, ENDINGS.combo[key] || ENDINGS.combo['etc']);
  }
  return Object.assign({ kind:'chaos' }, ENDINGS.chaos);
}

/* --- リプレイ / セーブ ---------------------------------------------------- */
function replay(seed, actions){
  let st = createState(seed);
  const reports = [];
  for (const a of actions){
    if (st.finished) break;
    const r = resolve(st, a);
    st = r.next; reports.push(r.report);
  }
  return { state: st, reports };
}
function encodeSave(st){
  return 'IR1:' + st.seed + ':' + st.actions
    .map(a => [a.charId, a.stance === 'support' ? 0 : 1, a.ownF, a.argueF, a.cards.join('')].join(','))
    .join(';');
}
function decodeSave(code){
  const s = String(code).trim();
  if (!s.startsWith('IR1:')) throw new Error('コードの形式が違います');
  const parts = s.slice(4).split(':');
  const seed = parseInt(parts[0], 10) >>> 0;
  const body = parts.slice(1).join(':');
  const actions = !body ? [] : body.split(';').filter(Boolean).map(chunk => {
    const [c, s2, o, f, k] = chunk.split(',');
    return { charId:+c, stance: +s2 === 0 ? 'support' : 'convert',
             ownF:+o, argueF:+f, cards: Array.from(k).map(Number) };
  });
  return { seed, actions };
}
function hashState(st){
  const s = JSON.stringify([st.seed, st.turn, st.currents, st.contacts, st.banned, st.lastLen, st.finished]);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

const ENGINE = { mulberry32, streamOf, FACTIONS, ERAS, RANKS, CHARACTERS, CHAR_BY_ID, CARDS, CATS,
  TIES, ENDINGS, MAX_TURN, GOAL, CAP, createState, totalOf, eraOf, eraOfTotal, rankOfId, baseId,
  meetingList, introPick, cardOptions, composeArgument, resolve, evaluateEnding, replay,
  encodeSave, decodeSave, hashState };
if (typeof globalThis !== 'undefined') globalThis.ENGINE = ENGINE;
/* ==ENGINE END== */

        <div class="quote">「${esc(text)}」</div>` : ''}
      <div class="row">
        <button class="primary" id="go" ${ready?'':'disabled'}>この論で臨む</button>
        <button id="back">戻る</button>
      </div>
    </div>`;
  app.querySelectorAll('.card').forEach(el => el.onclick = () => {
    ui.picks[+el.dataset.cat] = +el.dataset.m; render();
  });
  document.getElementById('back').onclick = () => { ui.stance = null; ui.argueF = null; ui.screen = 'stance'; render(); };
  document.getElementById('go').onclick = () => {
    const r = E.resolve(st, { charId: ui.charId, stance: ui.stance, ownF: ui.ownF,
                              argueF: ui.argueF, cards: ui.picks.slice() });
    st = r.next; ui.report = r.report; ui.screen = 'result'; render();
  };
}

/* --- 画面: 結果 ---------------------------------------------------------- */
function viewResult(){
  const r = ui.report, c = E.CHAR_BY_ID.get(r.charId);
  const marks = r.hits.map((h,i) => `<div class="small">${h?'☑':'☐'} ${E.CATS[i].name}：${
    h ? '刺さった' : `外れ（この人物に効くのは「${E.CATS[i].motives[c.correct[i]]}」）`}</div>`).join('');
  const d = r.delta.map((v,i) => v ? `<span class="${fac(i).cls}">[${fac(i).name}] ${v>0?'+':''}${v}</span>` : null)
    .filter(Boolean).join('　') || '変動なし';
  app.innerHTML = headerHTML() +
    `<div class="result">
      <div class="verdict v${r.score}">${r.verdict}</div>
      <div class="small" style="margin-top:4px">${esc(c.name)}（${E.RANKS[r.rank]}）に${
        r.stance==='support'?'賛意を示した':`${fac(r.argueF).name}への転向を迫った`}</div>
      <div class="quote">「${esc(r.text)}」</div>
      ${marks}
      ${r.premature ? `<div class="warn">※ 時期尚早のため、${E.RANKS[r.rank]}級ですが影響力は限定的です（ランク補正を無効化）</div>` : ''}
      ${r.penalty ? `<div class="warn">※ ${E.RANKS[r.rank]}級との決裂により時勢 -${r.penalty}</div>` : ''}
      <div class="delta">${d}</div>
      ${r.contactAdded ? `<div class="small">→ ${esc(c.name)}が【人脈】に加わった。</div>` : ''}
      ${r.bannedNow ? `<div class="small">→ ${esc(c.name)}は激怒し、二度と現れない。</div>` : ''}
      <div class="small" style="margin-top:8px;opacity:.7">この論証は ${r.len} 字。次の面会者はこの数から導かれます。</div>
    </div>` + chartHTML() +
    `<div class="row"><button class="primary" id="next">${st.finished?'結末を見る':'次のターンへ'}</button></div>`
    + saveBoxHTML();
  document.getElementById('next').onclick = () => { ui.screen = st.finished ? 'ending' : 'meeting'; render(); };
}

/* --- 画面: エンディング --------------------------------------------------- */
function viewEnding(){
  const e = E.evaluateEnding(st);
  const heads = ['国内政治','国際関係','あなたのその後'];
  app.innerHTML = headerHTML() + chartHTML() +
    `<div class="panel ending">
      <div class="kind">${e.kind==='solo'?'単独覇権エンド':e.kind==='combo'?'複合革命エンド':'混沌エンド'}</div>
      <div class="title">『${esc(e.t)}』</div>
      <div class="kind" style="color:var(--sumi2)">${esc(e.s)}</div>
      ${e.p.map((para,i) => `<h3>${heads[i]}</h3><p>${esc(para)}</p>`).join('')}
    </div>` + saveBoxHTML() +
    `<div class="row"><button class="primary" id="again">最初から</button></div>`;
  document.getElementById('again').onclick = () => { st = null; ui.screen = 'title'; render(); };
}

function saveBoxHTML(){
  return `<div class="panel"><h2>保存 / 共有</h2>
    <div class="small">このコードを控えれば、同じ盤面をいつでも再現できます。</div>
    <textarea readonly>${esc(E.encodeSave(st))}</textarea>
    <div class="small" style="opacity:.7">state hash: <code class="seed">${E.hashState(st)}</code></div>
  </div>`;
}

function render(){
  ({ title:viewTitle, meeting:viewMeeting, stance:viewStance,
     cards:viewCards, result:viewResult, ending:viewEnding })[ui.screen]();
  window.scrollTo(0,0);
}
render();
</script>
